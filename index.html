
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Perodua Car Code Lookup</title>

<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  background: #f2f5fa;
  color: #172033;
  margin: 0;
  padding: 16px;
}
.container { max-width: 900px; margin: auto; }
header {
  background: #173eea;
  color: white;
  padding: 22px;
  border-radius: 12px;
  margin-bottom: 16px;
}
h1 { margin: 0 0 8px; font-size: 24px; }
.panel {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 16px;
  border: 1px solid #d8dfeb;
}
input {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  border: 1px solid #aab7cc;
  border-radius: 8px;
  margin: 10px 0;
}
button {
  padding: 12px 18px;
  border: 0;
  border-radius: 8px;
  background: #173eea;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-right: 6px;
}
.result {
  background: #f8faff;
  border: 1px solid #d8dfeb;
  border-radius: 8px;
  padding: 14px;
  margin-top: 12px;
}
.code {
  font-size: 25px;
  font-weight: bold;
  color: #173eea;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}
th, td {
  text-align: left;
  padding: 9px;
  border: 1px solid #ccd4e1;
}
th { background: #477fe2; color: white; }
.table-wrap { overflow-x: auto; }
.note { color: #667085; font-size: 13px; }
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Perodua Car Code Lookup</h1>
  <div>FIXED VERSION V3 — EXACT VARIANT MATCHING</div>
</header>

<section class="panel">
  <h2>Search Car / Colour Code</h2>
  <input id="query"
    placeholder="Example: BEZZA X, AQ3XZ1, CG1SZ B89">

  <button onclick="search()">Search</button>
  <button onclick="clearSearch()"
    style="background:#667085">Clear</button>

  <div class="note">
    Search by model, variant, internal code or colour code.
  </div>

  <div id="output"></div>
</section>

<section class="panel">
<h2>Model Codes</h2>
<div class="table-wrap">
<table>
<thead>
<tr><th>Internal Code</th><th>Model</th><th>Variant</th></tr>
</thead>
<tbody id="modelTable"></tbody>
</table>
</div>
</section>

<section class="panel">
<h2>Colour Codes</h2>
<div class="table-wrap">
<table>
<thead>
<tr><th>Code</th><th>Official Colour</th><th>Applicable Models</th></tr>
</thead>
<tbody id="colourTable"></tbody>
</table>
</div>

<h2>Special / Two-Tone</h2>
<div class="table-wrap">
<table>
<thead>
<tr><th>Code</th><th>Colour</th><th>Description</th></tr>
</thead>
<tbody id="specialTable"></tbody>
</table>
</div>
</section>

</div>

<script>
const models = [
["Y5HZ","Traz","H"],
["Y5XZ","Traz","X"],
["BP5VZ","Alza","AV"],
["BP5HZ","Alza","H"],
["BP5XZ","Alza","X"],
["AQ3VZ1","Bezza","1.3 AV"],
["AQ3XZ1","Bezza","1.3 X"],
["AQ1GZ1","Bezza","1.0 G"],
["CG1VZ","Axia","AV"],
["CG1SZ","Axia","SE"],
["CG1XZ","Axia","X"],
["CG1GZ","Axia","G"],
["W5VZ2","Aruz","AV"],
["W5XZ2","Aruz","X"],
["U1VZ","Ativa","AV"],
["U1HZ","Ativa","H"],
["U1XZ","Ativa","X"],
["BD5VZ","Myvi 1.5","AV"],
["BD5HZ","Myvi 1.5","H"],
["BD5XZ","Myvi 1.5","X"],
["BD3GZ","Myvi 1.3","G"],
["BD3GZ1","Myvi 1.3 (low spec)","G1"]
];

const colours = [
["W09","White","All models"],
["S28","Silver","All models"],
["S43","Granite Grey","All models"],
["R67","Red / Maroon","Bezza / Aruz / Alza"],
["R76","Cranberry Red","Myvi / Axia / Traz"],
["B81","Electric Blue","Bezza / Myvi"],
["B89","Coral Blue","Axia"],
["W25","White / Pearl White","Ativa"],
["R75","Red","Ativa"]
];

const special = [
["XJ2","2-Tone Red","Black roof + Red body — Ativa"],
["XJ3","2-Tone White","Black roof + White body — Ativa"],
["XL2","2-Tone Silver","Black roof + Silver body — Traz"],
["XL3","2-Tone Blue","Black roof + Blue body — Traz"]
];

function normalize(value) {
  return value.toUpperCase()
    .replace(/[^A-Z0-9.]+/g, " ")
    .trim()
    .replace(/\s+/g, " ");
}

function tokensOf(value) {
  return normalize(value).split(" ").filter(Boolean);
}

function renderTables() {
  document.getElementById("modelTable").innerHTML =
    models.map(m =>
      `<tr><td>${m[0]}</td><td>${m[1]}</td><td>${m[2]}</td></tr>`
    ).join("");

  document.getElementById("colourTable").innerHTML =
    colours.map(c =>
      `<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td></tr>`
    ).join("");

  document.getElementById("specialTable").innerHTML =
    special.map(s =>
      `<tr><td>${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td></tr>`
    ).join("");
}

function findModel(input) {
  const tokens = tokensOf(input);

  // 1. Exact model code has priority.
  const exactCode = models.find(m => tokens.includes(m[0]));
  if (exactCode) return [exactCode];

  // 2. BEZZA: exact, independent variant rules.
  if (tokens.includes("BEZZA")) {
    let code = "";

    if (tokens.includes("1.3") && tokens.includes("AV")) {
      code = "AQ3VZ1";
    } else if (tokens.includes("1.3") && tokens.includes("X")) {
      code = "AQ3XZ1";
    } else if (tokens.includes("AV")) {
      code = "AQ3VZ1";
    } else if (tokens.includes("X")) {
      code = "AQ3XZ1";
    } else if (tokens.includes("1.0") && tokens.includes("G")) {
      code = "AQ1GZ1";
    }

    if (code) return models.filter(m => m[0] === code);
    return models.filter(m => m[1] === "Bezza");
  }

  // 3. Identify other models.
  let modelName = "";

  if (tokens.includes("MYVI") && tokens.includes("G1")) {
    modelName = "Myvi 1.3 (low spec)";
  } else if (tokens.includes("MYVI") && tokens.includes("1.3")) {
    modelName = "Myvi 1.3";
  } else if (tokens.includes("MYVI") && tokens.includes("1.5")) {
    modelName = "Myvi 1.5";
  } else if (tokens.includes("MYVI")) {
    modelName = "Myvi";
  } else if (tokens.includes("TRAZ")) {
    modelName = "Traz";
  } else if (tokens.includes("ALZA")) {
    modelName = "Alza";
  } else if (tokens.includes("AXIA")) {
    modelName = "Axia";
  } else if (tokens.includes("ARUZ")) {
    modelName = "Aruz";
  } else if (tokens.includes("ATIVA")) {
    modelName = "Ativa";
  }

  if (!modelName) return [];

  const pool = models.filter(m => m[1] === modelName);
  if (!pool.length) return [];

  let variant = "";

  if (tokens.includes("AV")) variant = "AV";
  else if (tokens.includes("SE")) variant = "SE";
  else if (tokens.includes("G1")) variant = "G1";
  else if (tokens.includes("H")) variant = "H";
  else if (tokens.includes("X")) variant = "X";
  else if (tokens.includes("G")) variant = "G";

  if (!variant) return pool;

  return pool.filter(m => m[2].toUpperCase() === variant);
}

function search() {
  const input = document.getElementById("query").value.trim();
  const output = document.getElementById("output");

  if (!input) {
    output.innerHTML = "<div class='result'>Please enter a search term.</div>";
    return;
  }

  const tokens = tokensOf(input);
  const matchedModels = findModel(input);

  const matchedColours = colours.filter(c => tokens.includes(c[0]));
  const matchedSpecial = special.filter(s => tokens.includes(s[0]));

  let html = "";

  if (matchedModels.length) {
    html += matchedModels.map(m => `
      <div class="result">
        <div>Internal Model Code</div>
        <div class="code">${m[0]}</div>
        <div>Model: <b>${m[1]}</b></div>
        <div>Variant: <b>${m[2]}</b></div>
      </div>
    `).join("");
  }

  if (matchedColours.length) {
    html += matchedColours.map(c => `
      <div class="result">
        <div>Colour Code: <span class="code">${c[0]}</span></div>
        <div>Official Colour: <b>${c[1]}</b></div>
        <div>Applicable Models: ${c[2]}</div>
      </div>
    `).join("");
  }

  if (matchedSpecial.length) {
    html += matchedSpecial.map(s => `
      <div class="result">
        <div>Special Colour Code: <span class="code">${s[0]}</span></div>
        <div>Colour: <b>${s[1]}</b></div>
        <div>${s[2]}</div>
      </div>
    `).join("");
  }

  if (!html && matchedModels.length === 0) {
    html = "<div class='result'>No match found. Please check the model, variant or code.</div>";
  }

  output.innerHTML = html;
}

function clearSearch() {
  document.getElementById("query").value = "";
  document.getElementById("output").innerHTML = "";
}

document.getElementById("query").addEventListener("keydown", function(e) {
  if (e.key === "Enter") search();
});

renderTables();
</script>
</body>
</html>
