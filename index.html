<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Code Lookup</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
  .wrap{max-width:720px;margin:auto;padding:20px}
  .card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.08);margin-bottom:16px}
  h1{margin:0 0 6px;font-size:28px}
  .sub{color:#687386;margin-bottom:20px}
  input{width:100%;font-size:20px;padding:15px;border:2px solid #d8dfeb;border-radius:12px;text-transform:uppercase;outline:none}
  input:focus{border-color:#2457e6}
  button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#2457e6;color:white;font-size:18px;font-weight:bold}
  button.secondary{background:#e9eef8;color:#24324a}
  .result{display:none}
  .row{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid #e8ecf2}
  .row:last-child{border-bottom:0}
  .label{color:#718096}
  .value{font-weight:bold;text-align:right}
  .model{font-size:25px}
  .colour{font-size:21px}
  .ok{color:#168447}
  .error{color:#c62828;font-weight:bold;padding:12px 0}
  .hint{font-size:13px;color:#778196;margin-top:10px}
  .badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#edf2ff;color:#2457e6;font-weight:bold}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🚗 Car Code Lookup</h1>
    <div class="sub">Enter the CAR Code and Colour Code to get the exact model, variant and colour.</div>

    <label><b>Enter CAR Code + Colour Code</b></label>
    <input id="allCode" placeholder="Example: Y5HZ S43" autocomplete="off">

    <button onclick="lookup()">Search</button>
    <button class="secondary" onclick="clearAll()">Clear</button>
    <div class="hint">Examples: <b>Y5HZ S43</b> → Perodua TRAZ H • Granite Grey<br>
    <b>Axia SE Coral Blue</b> → CG1SZ B89<br>
    <b>Perodua Axia SE</b> → CG1SZ</div>
  </div>

  <div id="result" class="card result"></div>
</div>

<script>
const models = {
  "Y5HZ": ["Traz","H"], "Y5XZ": ["Traz","X"],
  "BP5VZ": ["Alza","AV"], "BP5HZ": ["Alza","H"], "BP5XZ": ["Alza","X"],
  "AQ3VZ1": ["Bezza","1.3 AV"], "AQ3XZ1": ["Bezza","1.3 X"], "AQ1GZ1": ["Bezza","1.0 G"],
  "CG1VZ": ["Axia","AV"], "CG1SZ": ["Axia","SE"], "CG1XZ": ["Axia","X"], "CG1GZ": ["Axia","G"],
  "W5VZ2": ["Aruz","AV"], "W5XZ2": ["Aruz","X"],
  "U1VZ": ["Ativa","AV"], "U1HZ": ["Ativa","H"], "U1XZ": ["Ativa","X"],
  "BD5VZ": ["Myvi 1.5","AV"], "BD5HZ": ["Myvi 1.5","H"], "BD5XZ": ["Myvi 1.5","X"],
  "BD3GZ": ["Myvi 1.3","G"], "BD3GZ1": ["Myvi 1.3 (low spec)","G1"]
};

const colours = {
  "W09": ["White","All models"],
  "S28": ["Silver","All models"],
  "S43": ["Granite Grey","All models"],
  "R67": ["Red / Maroon","Bezza / Aruz / Alza"],
  "R76": ["Cranberry Red","Myvi / Axia / Traz"],
  "B81": ["Electric Blue","Bezza / Myvi"],
  "B89": ["Coral Blue","Axia"],
  "W25": ["White / Pearl White","Ativa"],
  "R75": ["Red","Ativa"],
  "XJ2": ["2-Tone Red","Black roof + Red body — Ativa"],
  "XJ3": ["2-Tone White","Black roof + White body — Ativa"],
  "XL2": ["2-Tone Silver","Black roof + Silver body — Traz"],
  "XL3": ["2-Tone Blue","Black roof + Blue body — Traz"]
};

function normalizeText(s){
  return s.toUpperCase().replace(/[–—]/g,"-").replace(/\s+/g," ").trim();
}

function findModelFromText(raw){
  const t=normalizeText(raw);
  // Exact code first.
  if(models[t]) return t;

  // Find model code embedded in the input.
  const embedded=Object.keys(models).sort((a,b)=>b.length-a.length).find(x=>t.includes(x));
  if(embedded) return embedded;

  // Match model + variant from the user's words.
  const aliases={
    "TRAZ":"TRAZ",
    "ALZA":"ALZA",
    "BEZZA":"BEZZA",
    "AXIA":"AXIA",
    "ARUZ":"ARUZ",
    "ATIVA":"ATIVA",
    "MYVI":"MYVI"
  };

  let best=null, score=-1;
  for(const [code,[model,variant]] of Object.entries(models)){
    const base=model.replace(" (low spec)","").toUpperCase();
    let s=0;
    if(t.includes(base)) s+=3;
    const v=variant.toUpperCase();
    if(t.includes(v)) s+=2;
    // Accept common forms such as "MYVI 1.5 AV", "AXIA SE", "TRAZ H".
    if(t.includes("PERODUA "+base)) s+=1;
    if(s>score){best=code;score=s;}
  }
  return score>=3 ? best : null;
}

function findColourFromText(raw){
  const t=normalizeText(raw);

  if(colours[t]) return t;

  const embedded=Object.keys(colours).sort((a,b)=>b.length-a.length).find(x=>t.includes(x));
  if(embedded) return embedded;

  let best=null, score=-1;
  for(const [code,[colour]] of Object.entries(colours)){
    const c=colour.toUpperCase();
    let s=0;
    if(t.includes(c)) s=4;
    // Flexible common colour wording.
    const words=c.split(/[\s/]+/).filter(Boolean);
    const matched=words.filter(w=>t.includes(w)).length;
    s=Math.max(s, matched);
    if(s>score){best=code;score=s;}
  }
  return score>=1 ? best : null;
}

function lookup(){
  const raw=document.getElementById("allCode").value.trim();
  const box=document.getElementById("result");
  box.style.display="block";

  if(!raw){
    box.innerHTML='<div class="error">Please enter a CAR Code + Colour Code, or model + colour.</div>';
    return;
  }

  const carCode=findModelFromText(raw);
  const colourCode=findColourFromText(raw);

  if(!carCode && !colourCode){
    box.innerHTML='<div class="error">❌ No matching model or colour found</div><div class="hint">Try: CG1SZ B89, Axia SE Coral Blue, or Perodua Traz H Granite Grey.</div>';
    return;
  }

  let out='';

  if(carCode){
    const [model,variant]=models[carCode];
    out += `<div class="row"><div class="label">CAR Code</div><div class="value"><span class="badge">${carCode}</span></div></div>`;
    out += `<div class="row"><div class="label">Model</div><div class="value model">Perodua ${model.toUpperCase()}</div></div>`;
    out += `<div class="row"><div class="label">Variant</div><div class="value">${variant}</div></div>`;
  } else {
    out += `<div class="row"><div class="label">CAR Code</div><div class="value error">Not found</div></div>`;
  }

  if(colourCode){
    const [colour]=colours[colourCode];
    out += `<div class="row"><div class="label">Colour Code</div><div class="value"><span class="badge">${colourCode}</span></div></div>`;
    out += `<div class="row"><div class="label">Colour</div><div class="value colour">${colour}</div></div>`;
  } else {
    out += `<div class="row"><div class="label">Colour Code</div><div class="value error">Not found</div></div>`;
  }

  if(carCode && colourCode){
    const model=models[carCode][0].replace(" (low spec)","").toUpperCase();
    const applicable=colours[colourCode][1].toUpperCase();
    const compatible=applicable==="ALL MODELS" || applicable.includes(model.split(" ")[0]);
    out += `<div class="row"><div class="label">Compatibility</div><div class="value ${compatible?'ok':''}">${compatible?'✅ Compatible':'⚠️ Please check model/colour combination'}</div></div>`;
  }

  box.innerHTML=out;
}

function clearAll(){
  document.getElementById("allCode").value="";
  document.getElementById("result").style.display="none";
  document.getElementById("allCode").focus();
}

document.getElementById("allCode").addEventListener("keydown",e=>{if(e.key==="Enter")lookup();});
</script>
</body>
</html>
